[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1000
via_ir = false
bytecode_hash = "none"
# Masterplan 396-A: accounting bugs are the primary risk. Fail on any warning.
deny = "warnings"
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024
depth = 128
