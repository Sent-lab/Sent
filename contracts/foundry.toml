[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1000
via_ir = true
bytecode_hash = "none"
# Lint runs in CI as an informational step, not as a build gate (D-008).
# Every hit in this codebase is either in a test or is a deliberate, documented
# design decision in Curve.sol - the bounded correction loop and the rescaling
# that is the sole reason the curve math does not overflow uint256. Blocking on
# them would be theatre. The real gates are the compiler, the fuzz and invariant
# suites, the differential tests against packages/economics, and security review.
# Read everywhere for fixtures; write ONLY into the fixture directory, so a test
# can capture chain output without being able to touch source or config.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./test/fixtures" },
]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024
depth = 128

# Masterplan 411 places invariant suites in contracts/invariants/, which is not
# one of Foundry's default compiled paths. A dedicated profile keeps the repo
# shape the masterplan specifies instead of relocating the suite to suit the tool.
[profile.inv]
test = "invariants"

[profile.inv.invariant]
runs = 256
depth = 64
fail_on_revert = false

# HyperEVM ships two block lanes: a default one capped at 3,000,000 gas and an
# opt-in one capped at 30,000,000. A fork inherits the tip block's limit, which is
# the small lane ~99% of the time, and the full graduation path costs 5.40M gas.
#
# Foundry's `isolate` mode - on by default here - models each top-level call as a
# real transaction, and under it this suite capped at 3.19M no matter what
# `block_gas_limit` said. That is not a Foundry defect. Isolate mode was
# reproducing HyperEVM's actual small-lane ceiling, and it found the constraint
# recorded as V-20: graduation cannot be included in a default-lane block.
#
# These two settings exist so the fork tests measure the CONTRACTS. The lane
# constraint is a deployment fact, tested in its own right by V-20, not something
# to rediscover as an unexplained OutOfGas in every unrelated mint assertion.
[profile.fork]
block_gas_limit = 30000000
isolate = false
